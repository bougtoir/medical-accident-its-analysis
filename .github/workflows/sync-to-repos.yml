name: Sync branches to independent repos

# Schedule runs from the default branch (master), so the workflow file
# only needs to exist here. Runs every 15 minutes to detect branch changes.
# Can also be triggered manually via workflow_dispatch.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wip repo (all branches)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Sync all tracked branches
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          # Define branch -> target repo mapping
          declare -A BRANCH_MAP

          # ── Heat and traffic-crash mortality (US FARS + Japan NPA, GHCN) ──
          # Track the merged mainline branch so the public repo reproduces the manuscript.
          BRANCH_MAP["devin/1784701414-heat-accidents-mortality"]="heat-accidents-mortality"

          # ── Original entries ──
          BRANCH_MAP["IONE-stratification-framework"]="ione-stratification-framework"
          BRANCH_MAP["devin/1774274321-rct-decomposition-paper"]="kotha-rct-decomposition"
          BRANCH_MAP["devin/1774353301-icr-paper"]="linko-icr-paper"
          BRANCH_MAP["devin/1783102664-jma-journal-manuscript"]="medical-accident-its-analysis"
          BRANCH_MAP["devin/1774578035-cetacean-acoustic-analysis"]="cetacean-acoustic-analysis"
          # Superseded by the Software Impacts branch below (same target repo),
          # which contains the package plus the external-validation pipeline and
          # the Software Impacts submission materials.
          # BRANCH_MAP["devin/1774681647-yoshka-pkpd-package"]="yoshika-pkpd"
