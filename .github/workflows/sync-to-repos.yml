          EXCLUDE_MAP["devin/1784904207-transport-policy"]="build_submission.py output/Manuscript_TransportPolicy.docx output/Cover_Letter_TransportPolicy.docx output/Title_Page_TransportPolicy.docx output/Submission_Checklist_TransportPolicy.docx output/Highlights_TransportPolicy.docx output/Highlights_TransportPolicy.txt output/TransportPolicy_submission_package.zip output/VALIDATION.txt output/Citation_Audit.csv output/Reference_Verification.csv output/Reporting_Guideline_PRISMA-ScR.docx"
          # yoshika-software-impacts is branched from the monorepo root, so the
          # yoshika project (yoshika/, tests/, paper/, pyproject.toml, README,
          # LICENSE) sits alongside many unrelated project folders. Exclude every
          # non-yoshika top-level entry so the public yoshika-pkpd repo contains
          # only the package + its paper materials. Submission correspondence
          # (cover/rebuttal letters) is also excluded.
          EXCLUDE_MAP["devin/1784709022-yoshika-software-impacts"]=".agents anesthesia-record archaic_language_typology ava_lllt_hypothesis ba_sphere_dashboard.html ba_sphere_simulation.py beyond-gdp-national-power biwa_archaeological_prospection buddhist_food_lexicon_map canonical_curves_reexamination clinical_noise_inverse_problem color_cooking_concept data denisovan-archaic-dna-analysis desflurane_critical_appraisal documents dvs_noise_inverse_problem flood-prediction-review garment-printer-app gdp_cwon_integration gdp_tempo_paper gdp_tempo_poc generate_new_figures.py gis_data healthcare_economic_effect healthcare_tempo_poc khmer_inscription_analysis landmine_transparent_map medical_accident_its_analysis medical_sapir_whorf meeting-slides montmorillonite_decaf montmorillonite_oil ndb-pain-regional-variation-japan output paper-dashboard pose_alignment_tool project-hub pwv_vitaldb_analysis reports round1_crime_analysis scripts sits9 slides spectral-causality-a2-ecd spectral-causality-brainstorm spectral-causality-jmlr sr_ancova_framework stem_cell_seasonality tasuki-electoral-model tempo-effect-paper threebody_pk_compartment tommo_taste_receptor_2025-0057 vaporizer-price-study weibull-clinical-dropout yago_cs_bleeding yago_ionv zero_calibration_pmea paper/cover_letter_revised.docx paper/cover_letter_revised.md paper/rebuttal_letter.docx paper/rebuttal_letter.md paper/software_impacts/cover_letter.docx paper/software_impacts/cover_letter.md"

          OWNER="bougtoir"

          # Validate PAT owner matches target namespace
          PAT_USER=$(curl -s -H "Authorization: token ${SYNC_PAT}" \
            https://api.github.com/user | python3 -c "import json,sys; print(json.load(sys.stdin).get('login',''))")
          if [ "$PAT_USER" != "$OWNER" ]; then
            echo "ERROR: SYNC_PAT belongs to '$PAT_USER', expected '$OWNER'"
            exit 1
          fi
          echo "Validated PAT owner: $PAT_USER"

          SYNCED=0
          SKIPPED=0
          FAILED=0
          CREATED=0

          for BRANCH in "${!BRANCH_MAP[@]}"; do
            TARGET_REPO="${BRANCH_MAP[$BRANCH]}"

            # Get wip branch SHA
            WIP_SHA=$(git rev-parse "origin/$BRANCH" 2>/dev/null || echo "")
            if [ -z "$WIP_SHA" ]; then
              echo "SKIP: Branch '$BRANCH' not found in wip"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Get target repo main branch SHA
            TARGET_SHA=$(git ls-remote "https://x-access-token:${SYNC_PAT}@github.com/${OWNER}/${TARGET_REPO}.git" refs/heads/main 2>/dev/null | cut -f1 || echo "")

            # If target repo does not exist, create it
            if [ -z "$TARGET_SHA" ]; then
              # Check if repo exists but is empty (ls-remote returns empty for empty repos too)
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: token ${SYNC_PAT}" \
                "https://api.github.com/repos/${OWNER}/${TARGET_REPO}")
              if [ "$HTTP_CODE" = "404" ]; then
                echo "CREATE: Creating repo ${OWNER}/${TARGET_REPO} for branch $BRANCH"
                CREATE_RESP=$(curl -s -w "\n%{http_code}" \
                  -X POST \
                  -H "Authorization: token ${SYNC_PAT}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/user/repos" \
                  -d "{\"name\":\"${TARGET_REPO}\",\"private\":false,\"auto_init\":false}")
                # POST /user/repos creates under the authenticated user (validated above as $OWNER)
                CREATE_CODE=$(echo "$CREATE_RESP" | tail -1)
                if [ "$CREATE_CODE" != "201" ]; then
                  echo "ERROR: Failed to create repo $TARGET_REPO (HTTP $CREATE_CODE)"
                  FAILED=$((FAILED + 1))
                  continue
                fi
                CREATED=$((CREATED + 1))
                # Small delay to let GitHub propagate
                sleep 2
              fi
            fi

            # Determine what to push
            PUSH_REF="origin/$BRANCH"
            COMPARE_SHA="$WIP_SHA"

            # Use branch tip date for deterministic but realistic timestamps
            ORIG_DATE=$(git log -1 --format='%aI' "origin/$BRANCH")

            # If SUBDIR_MAP entry exists, extract only that subdirectory
            SUBDIR="${SUBDIR_MAP[$BRANCH]:-}"
            if [ -n "$SUBDIR" ]; then
              # Verify the subdirectory exists in the branch
              if ! git rev-parse "origin/$BRANCH:$SUBDIR" >/dev/null 2>&1; then
                echo "ERROR: Subdirectory '$SUBDIR' not found in branch '$BRANCH'"
                FAILED=$((FAILED + 1))
                continue
              fi
              TEMP_INDEX=$(mktemp)
              GIT_INDEX_FILE="$TEMP_INDEX" git read-tree "origin/${BRANCH}:${SUBDIR}"

              # Apply file exclusions if EXCLUDE_MAP entry exists
              EXCLUDES="${EXCLUDE_MAP[$BRANCH]:-}"
              if [ -n "$EXCLUDES" ]; then
                for EXCL in $EXCLUDES; do
                  GIT_INDEX_FILE="$TEMP_INDEX" git rm -rf --cached "$EXCL" >/dev/null 2>&1 || true
                done
              fi

              FILTERED_TREE=$(GIT_INDEX_FILE="$TEMP_INDEX" git write-tree)
              rm -f "$TEMP_INDEX"
              COMPARE_SHA=$(GIT_AUTHOR_DATE="$ORIG_DATE" \
                GIT_COMMITTER_DATE="$ORIG_DATE" \
                GIT_AUTHOR_NAME="wip-sync" GIT_AUTHOR_EMAIL="sync@wip" \
                GIT_COMMITTER_NAME="wip-sync" GIT_COMMITTER_EMAIL="sync@wip" \
                git commit-tree "$FILTERED_TREE" -m "sync: $BRANCH (subdir: $SUBDIR)")
              PUSH_REF="$COMPARE_SHA"
            else
              # No subdir filter — strip .github/workflows/ and apply exclusions
              WORKFLOW_FILES=$(git ls-tree -r --name-only "origin/$BRANCH" -- .github/workflows/ 2>/dev/null | head -1)
              EXCLUDES="${EXCLUDE_MAP[$BRANCH]:-}"
              if [ -n "$WORKFLOW_FILES" ] || [ -n "$EXCLUDES" ]; then
                TEMP_INDEX=$(mktemp)
                GIT_INDEX_FILE="$TEMP_INDEX" git read-tree "origin/$BRANCH"
                GIT_INDEX_FILE="$TEMP_INDEX" git rm -rf --cached .github/workflows/ >/dev/null 2>&1 || true
                if [ -n "$EXCLUDES" ]; then
                  for EXCL in $EXCLUDES; do
                    GIT_INDEX_FILE="$TEMP_INDEX" git rm -rf --cached "$EXCL" >/dev/null 2>&1 || true
                  done
                fi
                FILTERED_TREE=$(GIT_INDEX_FILE="$TEMP_INDEX" git write-tree)
                rm -f "$TEMP_INDEX"
                COMPARE_SHA=$(GIT_AUTHOR_DATE="$ORIG_DATE" \
                  GIT_COMMITTER_DATE="$ORIG_DATE" \
                  GIT_AUTHOR_NAME="wip-sync" GIT_AUTHOR_EMAIL="sync@wip" \
                  GIT_COMMITTER_NAME="wip-sync" GIT_COMMITTER_EMAIL="sync@wip" \
                  git commit-tree "$FILTERED_TREE" -m "sync: $BRANCH (filtered)")
                PUSH_REF="$COMPARE_SHA"
              fi
            fi

            # Compare SHAs - skip if already in sync
            if [ "$COMPARE_SHA" = "$TARGET_SHA" ]; then
              echo "SKIP: $BRANCH -> $TARGET_REPO (already in sync: $COMPARE_SHA)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "SYNC: $BRANCH -> $TARGET_REPO (wip: $WIP_SHA, target: ${TARGET_SHA:-empty})"
            if git push --force "https://x-access-token:${SYNC_PAT}@github.com/${OWNER}/${TARGET_REPO}.git" "$PUSH_REF:refs/heads/main" 2>&1; then
              SYNCED=$((SYNCED + 1))
            else
              echo "ERROR: Failed to sync $BRANCH -> $TARGET_REPO"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Done: $SYNCED synced, $SKIPPED skipped, $FAILED failed, $CREATED repos created"
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
