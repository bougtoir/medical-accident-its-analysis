itch (FWD)</text><line stroke="#90A4AE" stroke-dasharray="5,3" stroke-width="2.0" x1="310" x2="340" y1="265" y2="265" /><text fill="#333333" font-family="Helvetica" font-size="9px" x="346" y="269">Back stitch (RET)</text><line stroke="#FF9800" stroke-width="1.5" x1="520" x2="550" y1="265" y2="265" /><text fill="#333333" font-family="Helvetica" font-size="9px" x="556" y="269">CROSS (needle passes through fabric)</text><circle cx="735" cy="265" fill="#333333" r="5" /><text fill="#333333" font-family="Helvetica" font-size="9px" x="746" y="269">ANCHOR (knot)</text><text fill="#222222" font-family="Helvetica" font-size="14px" font-weight="bold" text-anchor="middle" x="360.0" y="25">Pachelbel Canon — Textile Schema (Back-Stitch Pattern)</text><text fill="#888888" font-family="Helvetica" font-size="10px" text-anchor="middle" x="360.0" y="42">(Needle path alternating between surface and back of fabric)</text></svg>